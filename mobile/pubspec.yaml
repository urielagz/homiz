name: homiz
description: "Homiz · App de Inmobiliaria Zugar (clientes, inquilinos y personal)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/illustrations/
